<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Project detail page">
  <title>Project Detail — Portfolio</title>

  <!-- Google Fonts: Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Skip link for keyboard users -->
  <a href="#project-detail" class="skip-link">Skip to content</a>

  <!-- Theme toggle button -->
  <button
    id="theme-toggle"
    class="theme-toggle"
    aria-label="Switch to dark theme"
    aria-pressed="false"
    type="button"
  >
    <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
    <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <!-- Header / Nav -->
  <header class="site-header">
    <nav class="site-nav container" aria-label="Primary navigation">
      <a href="index.html#hero" class="nav-logo" aria-label="Home">Portfolio</a>
      <ul class="nav-links" role="list">
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <!-- Project detail content rendered here by script.js -->
    <section id="project-detail" class="section project-detail reveal">
      <div class="container">
        <div id="project-detail-content">
          <p class="projects-empty">Loading project...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-container">
      <p class="footer-text">&copy; 2026 Portfolio. Crafted with care.</p>
    </div>
  </footer>

  <!-- Scripts: config first, then renderer -->
  <script src="config.js"></script>
  <script src="script.js"></script>

</body>
</html>
